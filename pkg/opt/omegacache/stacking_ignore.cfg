// stacking_ignore.cfg — CProps to ignore when building Omega Cache item keys
//
// Items that differ ONLY by these CProps will share the same cache key
// and stack together in the cache. These CProps are NOT stored on the
// DataFile element and will be lost on withdrawal.
//
// This should generally align with config/stacking.cfg (Global_Ignore_CProps)
// which controls POL core's physical item stacking. If an item stacks in
// the backpack, it should also stack in the cache.
//
// See also: config/stacking.cfg
//
// Note: BaseName is deliberately NOT listed here even though it appears in
// config/stacking.cfg. We want items with different BaseName to have different
// cache keys (e.g., "Iron Sextant Parts" vs "Lavarock Sextant Parts").
// BaseName is in POL's stacking.cfg because POL ignores it for physical
// stacking, but for cache identity it matters.

// foodvalue is deliberately NOT listed here even though it appears in
// config/stacking.cfg. foodvalue determines hunger restoration and is
// gameplay-meaningful — items with different foodvalue should be stored
// separately to preserve the value on withdrawal.

// fromLoot on Alryc's request to allow looted items to stack irrespective
// of their loot origin

IgnoreCProps
{
	BackPackXYZ    1
	IDed           1
	#SecureRemove  1
	fromLoot       1
}
